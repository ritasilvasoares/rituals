<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rituals · O teu Mapa Biológico Único</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bordo: #5c2434;
  --bordo-claro: #7a3048;
  --creme: #F5EDE4;
  --areia: #e8d8cc;
  --escuro: #1c1c1c;
  --texto: #4a3040;
}
body { background:var(--creme); color:var(--escuro); font-family:'Montserrat',sans-serif; font-weight:300; line-height:1.6; }

/* BARRA */
.barra-urgencia { background:var(--bordo-claro); color:var(--creme); text-align:center; padding:9px 24px; font-size:11px; letter-spacing:2px; }
.barra-urgencia strong { color:#f0d0b0; letter-spacing:3px; }
.barra-countdown { background:var(--bordo); padding:10px 24px; display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; position:sticky; top:0; z-index:100; }
.count-unit { text-align:center; min-width:32px; }
.count-num { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; color:var(--creme); display:block; line-height:1; }
.count-label { font-size:8px; letter-spacing:1px; text-transform:uppercase; color:rgba(245,237,228,0.5); display:block; }
.count-sep { color:rgba(245,237,228,0.4); font-size:16px; }
.barra-btn { background:var(--creme); color:var(--bordo); padding:8px 18px; font-family:'Montserrat',sans-serif; font-size:10px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; text-decoration:none; display:inline-block; white-space:nowrap; }

/* HERO */
.hero { background:var(--bordo); color:var(--creme); padding:80px 24px 64px; text-align:center; }
.hero-eyebrow { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:rgba(245,237,228,0.5); margin-bottom:20px; }
.hero-titulo { font-family:'Cormorant Garamond',serif; font-size:clamp(64px,14vw,110px); font-weight:300; font-style:italic; line-height:1; color:var(--creme); margin-bottom:24px; }
.hero-headline { font-family:'Cormorant Garamond',serif; font-size:clamp(20px,4vw,28px); font-weight:300; font-style:italic; color:rgba(245,237,228,0.85); max-width:560px; margin:0 auto 16px; line-height:1.4; }
.hero-sub { font-size:clamp(13px,2.5vw,15px); color:rgba(245,237,228,0.6); max-width:440px; margin:0 auto 40px; line-height:1.7; }
.btn-principal { display:inline-block; background:var(--creme); color:var(--bordo); padding:16px 40px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:500; letter-spacing:2px; text-transform:uppercase; text-decoration:none; border:none; cursor:pointer; width:100%; max-width:440px; }
.btn-bordo { display:inline-block; background:var(--bordo); color:var(--creme); padding:16px 40px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:500; letter-spacing:2px; text-transform:uppercase; text-decoration:none; border:none; cursor:pointer; width:100%; max-width:440px; }

/* CORPO */
.corpo { max-width:580px; margin:0 auto; padding:64px 24px; }
.secao-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--bordo); margin-bottom:20px; display:flex; align-items:center; gap:12px; }
.secao-label::after { content:''; flex:1; height:1px; background:var(--areia); }
.divisor { height:1px; background:var(--areia); margin:48px 0; }
.texto { font-size:14px; color:var(--texto); line-height:1.8; margin-bottom:16px; }
.texto strong { color:var(--escuro); font-weight:500; }
.texto em { font-style:italic; color:var(--bordo); }

/* FRUSTRAÇÕES */
.frase-ancora { font-family:'Cormorant Garamond',serif; font-size:clamp(20px,4.5vw,28px); font-weight:500; color:var(--escuro); line-height:1.4; margin:32px 0; padding:24px 0; border-top:1px solid var(--areia); border-bottom:1px solid var(--areia); }
.frase-ancora em { font-style:italic; color:var(--bordo); }

/* POSSIBILIDADES */
.possibilidade-item { padding:13px 0; border-bottom:1px solid var(--areia); font-size:13px; color:var(--texto); line-height:1.6; display:flex; gap:12px; align-items:flex-start; }
.possibilidade-item::before { content:'◆'; font-size:6px; color:var(--bordo); margin-top:6px; flex-shrink:0; }
.possibilidade-item:last-child { border-bottom:none; }
.frase-final { font-family:'Cormorant Garamond',serif; font-size:clamp(22px,5vw,32px); font-style:italic; color:var(--bordo); text-align:center; line-height:1.3; padding:32px 0; }

/* VEÍCULO */
.veiculo-bloco { background:rgba(92,36,52,0.07); border-left:3px solid var(--bordo); padding:32px 28px; margin:32px 0; }
.veiculo-bloco p { font-size:14px; color:var(--texto); line-height:1.8; margin-bottom:12px; }
.veiculo-bloco p:last-child { margin-bottom:0; }
.veiculo-bloco strong { color:var(--bordo); }

/* MENTOR — LARGURA TOTAL */
.mentor-full { display:flex; width:100%; min-height:480px; }
.mentor-foto { flex:0 0 50%; overflow:hidden; }
.mentor-foto img { width:100%; height:100%; object-fit:cover; object-position:center 15%; display:block; }
.mentor-texto { flex:1; background:var(--creme); padding:48px 40px; display:flex; flex-direction:column; justify-content:center; }
.mentor-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--bordo); margin-bottom:24px; }
.mentor-p { font-size:14px; color:var(--texto); line-height:1.9; margin-bottom:14px; }
.mentor-p em { font-style:italic; color:var(--bordo); }
@media (max-width:600px) {
  .mentor-full { flex-direction:column; }
  .mentor-foto { flex:none; height:280px; }
  .mentor-texto { padding:32px 24px; }
}

/* PROGRAMA */
.programa-titulo { font-family:'Cormorant Garamond',serif; font-size:clamp(28px,6vw,42px); font-weight:300; font-style:italic; color:var(--escuro); margin-bottom:6px; }
.programa-sub { font-size:12px; color:#9a7080; margin-bottom:24px; letter-spacing:1px; }
.bullet-lista { list-style:none; margin:24px 0; }
.bullet-lista li { padding:12px 0; border-bottom:1px solid var(--areia); font-size:13px; color:var(--texto); line-height:1.6; display:flex; gap:12px; align-items:flex-start; }
.bullet-lista li:last-child { border-bottom:none; }
.bullet-lista li::before { content:'◆'; font-size:6px; color:var(--bordo); margin-top:6px; flex-shrink:0; }

/* CARTÕES */
.cartao { border:1px solid var(--areia); padding:20px 24px; background:#fff; margin-bottom:10px; }
.cartao-nome { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:500; color:var(--escuro); margin-bottom:6px; }
.cartao-desc { font-size:12px; color:#7a6a60; line-height:1.6; }

/* PRESENTES */
.presentes-bloco { background:var(--bordo); color:var(--creme); padding:32px; margin:32px 0; }
.presentes-eyebrow { font-size:9px
